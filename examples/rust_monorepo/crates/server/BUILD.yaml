# The crate's sources and cross-crate edges come from //:cargo, which
# synthesizes :_cargo_package from Cargo.toml; nothing here lists a file or a crate.
targets:
  - name: build
    dependencies:
      - //:workspace
      - :_cargo_package
    command: |
      cargo build -p server --release
      mkdir -p bin
      cp ../../target/release/server bin/server
    outputs:
      - bin/server

  - name: clippy
    dependencies:
      - //:workspace
      - :_cargo_package
    command: cargo clippy -p server --all-targets -- -D warnings
