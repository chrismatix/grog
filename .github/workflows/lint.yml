name: Lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Cache Go dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-lint-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-lint-

      - name: Run lint
        run: make lint
        env:
          TREEFMT_CI: true # Don't use formatter cache
