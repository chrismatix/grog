name: Update Homebrew Formula

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to update formula for"
        required: true
        type: string

jobs:
  update-homebrew:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      GH_TOKEN: ${{ secrets.HOMEBREW_PAT }}
      HOMEBREW_TAP_REPO: chrismatix/homebrew-grog
      FORMULA_NAME: grog

    steps:
      - name: Set release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Homebrew formulas
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern SHASUMS256.txt
          base_url="https://github.com/${{ github.repository }}/releases/download/$TAG"
          mkdir -p formula

          # Usage: write_formula <formula> <class> <binary prefix> <conflicting formula>
          write_formula() {
            local formula=$1 class=$2 prefix=$3 conflict=$4
            local -A sha
            for platform in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64; do
              sha[$platform]=$(awk -v file="$prefix-$platform" '$2 == file { print $1 }' SHASUMS256.txt)
              if [[ -z "${sha[$platform]}" ]]; then
                echo "Error: $prefix-$platform is missing from the $TAG release"
                exit 1
              fi
            done

            cat > "formula/$formula.rb" << EOF
          class $class < Formula
            desc "Grog build system CLI"
            homepage "https://github.com/${{ github.repository }}"
            version "$TAG"
            license "MIT"
            conflicts_with "$conflict", because: "both install a grog binary"

            on_macos do
              if Hardware::CPU.arm?
                url "$base_url/$prefix-darwin-arm64"
                sha256 "${sha[darwin-arm64]}"
              else
                url "$base_url/$prefix-darwin-amd64"
                sha256 "${sha[darwin-amd64]}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "$base_url/$prefix-linux-arm64"
                sha256 "${sha[linux-arm64]}"
              else
                url "$base_url/$prefix-linux-amd64"
                sha256 "${sha[linux-amd64]}"
              end
            end

            def install
              bin.install Dir["$prefix-*"].first => "grog"
              chmod 0755, bin/"grog"
            end

            test do
              system "#{bin}/grog", "--version"
            end
          end
          EOF

            echo "Generated formula/$formula.rb:"
            cat "formula/$formula.rb"
          }

          write_formula grog Grog grog grog-full
          write_formula grog-full GrogFull grog-full grog

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HOMEBREW_TAP_REPO }}
          token: ${{ env.GH_TOKEN }}
          path: homebrew-tap

      - name: Update formula and create PR
        run: |
          cd homebrew-tap

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Create branch name
          branch_name="update-${{ env.FORMULA_NAME }}-${{ steps.tag.outputs.tag }}"

          # Check if branch already exists and delete it
          if git ls-remote --exit-code --heads origin "$branch_name"; then
            echo "Branch $branch_name already exists, deleting it"
            git push origin --delete "$branch_name" || true
          fi

          # Create and switch to new branch
          git checkout -b "$branch_name"

          # Copy the new formulas
          mkdir -p Formula
          cp ../formula/*.rb Formula/
          git add Formula/

          # Check if there are changes
          if git diff --cached --quiet; then
            echo "No changes detected in formulas"
            exit 0
          fi

          # Commit changes
          git commit -m "Update ${{ env.FORMULA_NAME }} to ${{ steps.tag.outputs.tag }}"

          # Push branch
          git push origin "$branch_name"

          # Create pull request
          gh pr create \
            --repo "${{ env.HOMEBREW_TAP_REPO }}" \
            --title "Update ${{ env.FORMULA_NAME }} to ${{ steps.tag.outputs.tag }}" \
            --body "Automated update of ${{ env.FORMULA_NAME }} formula to version ${{ steps.tag.outputs.tag }}.

          **Changes:**
          - Updated version to ${{ steps.tag.outputs.tag }}
          - Updated SHA256 checksums for all platforms of grog and grog-full
          - Updated download URLs

          **Release:** https://github.com/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.tag }}" \
            --head "$branch_name" \
            --base main

      - name: Summary
        run: |
          {
            echo "## Homebrew Formula Update Summary"
            echo ""
            echo "- **Formula:** ${{ env.FORMULA_NAME }}"
            echo "- **Version:** ${{ steps.tag.outputs.tag }}"
            echo "- **Repository:** ${{ env.HOMEBREW_TAP_REPO }}"
            echo "- **Formulas:** grog, grog-full (Darwin AMD64/ARM64, Linux AMD64/ARM64)"
            echo ""
            echo "✅ Pull request created successfully!"
          } >> "$GITHUB_STEP_SUMMARY"
