name: Windows

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: jdx/mise-action@v4
        with:
          install_args: pkl

      - name: Install compiler
        run: |
          $archivePath = "$env:RUNNER_TEMP\winlibs.zip"
          Invoke-WebRequest 'https://github.com/brechtsanders/winlibs_mingw/releases/download/16.2.0posix-14.0.0-ucrt-r1/winlibs-x86_64-posix-seh-gcc-16.2.0-mingw-w64ucrt-14.0.0-r1.zip' -OutFile $archivePath
          if ((Get-FileHash $archivePath -Algorithm SHA256).Hash -ne 'c1f52294597c0b73786b2a78eb5d176d89226d2f21875eab75e783a8b1cefcc4') {
            throw 'Compiler checksum mismatch'
          }
          Expand-Archive $archivePath "$env:RUNNER_TEMP\winlibs"
          "$env:RUNNER_TEMP\winlibs\mingw64\bin" >> $env:GITHUB_PATH

      - name: Build Windows release
        run: ./.github/release-windows.ps1

      - name: Verify standalone executable
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          ./dist/grog-windows-amd64.exe version

      - name: Unit tests
        run: go test ./internal/... -timeout 180s

      - name: Windows integration tests
        run: |
          Copy-Item dist/grog-windows-amd64.exe dist/grog.exe
          go test ./integration/... -run TestWindows -timeout 180s -v

      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: grog-windows-amd64
          path: |
            dist/grog-windows-amd64.exe
            dist/grog-windows-amd64.exe.sha256
          if-no-files-found: error
