name: Grafana app

on:
  push:
    branches:
      - main
    paths:
      - integrations/grafana-app/**
      - .github/workflows/grafana-app.yml
  pull_request:
    paths:
      - integrations/grafana-app/**
      - .github/workflows/grafana-app.yml

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/grafana-app
    steps:
      - uses: actions/checkout@v6

      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('integrations/grafana-app/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
