name: Nix

on:
  pull_request:
    paths:
      - go.mod
      - go.sum
      - flake.nix
      - flake.lock
      - package.nix
      - .github/workflows/nix.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      # On a go.sum change, the failure prints the new vendorHash for package.nix.
      - run: nix build .#grog -L

      - run: ./result/bin/grog --version
